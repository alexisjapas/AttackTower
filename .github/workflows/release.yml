name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact: attack_tower
            archive_ext: tar.gz
            features: ""
          - os: windows-latest
            target: windows-x86_64
            artifact: attack_tower.exe
            archive_ext: zip
            features: ""
          - os: macos-latest
            target: macos-arm64
            artifact: attack_tower
            archive_ext: tar.gz
            # bevy_solari (the `raytracing` feature) needs Vulkan hardware RT
            # extensions which MoltenVK does not expose on macOS — drop it.
            features: "--no-default-features --features dlss,force_disable_dlss"

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libx11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist/attack_tower
          cp "target/release/${{ matrix.artifact }}" "dist/attack_tower/"
          cp -r assets "dist/attack_tower/"

      - name: Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czf "attack_tower-${{ matrix.target }}.tar.gz" -C dist attack_tower

      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist/attack_tower -DestinationPath "attack_tower-${{ matrix.target }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: attack_tower-${{ matrix.target }}.${{ matrix.archive_ext }}
          fail_on_unmatched_files: true
