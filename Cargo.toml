[package]
name = "attack_tower"
version = "0.2.0"
edition = "2024"
description = "POC of a bilateral 3D tower defense game (Rust + Bevy + Avian3d)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexisjapas/AttackTower"
keywords = ["game", "bevy", "tower-defense", "3d"]
categories = ["games"]
readme = "README.md"

[features]
default = ["raytracing", "dlss", "force_disable_dlss"]
raytracing = ["bevy/bevy_solari", "dep:wgpu"]
# DLSS is included by default but mocked (no NVIDIA NGX SDK required to build).
# At runtime, `DlssRayReconstructionSupported` will be absent so the menu
# entry stays disabled. To enable real DLSS, drop `force_disable_dlss`:
#   cargo run --release --no-default-features --features raytracing,dlss
dlss = ["bevy/dlss"]
force_disable_dlss = ["bevy/force_disable_dlss"]

[dependencies]
avian3d = "0.6.1"
# `jpeg`: the Meshy-exported building/prop glTFs embed JPEG textures.
bevy = { version = "0.18.1", features = ["mp3", "jpeg"] }
# Used at startup to probe whether the adapter actually supports the BLAS/TLAS
# limits Solari needs — without this, GPUs that advertise the raytracing
# feature flag but report `max_blas_geometry_count = 0` (e.g. AMD Vega) crash
# the renderer on the first frame.
wgpu = { version = "27.0.1", optional = true }

[profile.dev]
# Keep our own code unoptimized (fastest recompiles). Slim debuginfo to
# line-tables-only: panic backtraces still resolve to file:line, but linking is
# faster because there is far less debug data to emit and link.
debug = "line-tables-only"

[profile.dev.package."*"]
# Optimize dependencies (Bevy, Avian, wgpu...) even in debug. They are compiled
# once and rarely change, so this is a one-time cost, and it makes the debug
# build actually playable (unoptimized Bevy runs at single-digit FPS). It does
# not slow down iteration, which only recompiles our own crate.
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
